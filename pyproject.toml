[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "applytrack"
version = "0.1.0"
description = "A small CLI for tracking job applications, deadlines and statuses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samyaraj Ghosh" }]
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
applytrack = "applytrack.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/applytrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
